{% extends "admin/change_list.html" %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #trazabilidad-map {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #c8e6c9;
        }
    </style>
{% endblock %}

{% block content %}
    <!-- Contenedor del Mapa Real -->
    <div class="card p-3 mb-4" style="background: #ffffff; border-radius: 16px; border: 1px solid rgba(76, 175, 80, 0.15);">
        <h3 style="color: #2e7d32; font-weight: 600; font-size: 1.1rem; margin-bottom: 15px;">
            <i class="fas fa-map-marked-alt mr-2"></i> Ruta y Ubicaciones en Tiempo Real
        </h3>
        <div id="trazabilidad-map"></div>
    </div>

    <!-- Renderiza la tabla original de Django Admin -->
    {{ block.super }}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Coordenadas pasadas desde Django
            var puntos = {{ puntos_mapa|safe }};
            
            // Inicializar mapa centrado en Ecuador
            var map = L.map('trazabilidad-map').setView([0.811, -77.717], 10);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
            }).addTo(map);

            var bounds = [];
            var latLngs = [];

            puntos.forEach(function(p) {
                if (p.lat && p.lng) {
                    var marker = L.marker([p.lat, p.lng]).addTo(map);
                    marker.bindPopup(`<b>Producto:</b> ${p.producto}<br><b>Ubicación:</b> ${p.ubicacion}<br><b>Fecha:</b> ${p.fecha}`);
                    bounds.push([p.lat, p.lng]);
                    latLngs.push([p.lat, p.lng]);
                }
            });

            // Dibuja la línea de ruta conectando los puntos secuencialmente
            if (latLngs.length > 1) {
                var polyline = L.polyline(latLngs, {
                    color: '#2e7d32',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '5, 10'
                }).addTo(map);
            }

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }

            // Forzar a Leaflet a recalcular el tamaño
            setTimeout(function() {
                map.invalidateSize();
            }, 300);
        });
    </script>
{% endblock %}
